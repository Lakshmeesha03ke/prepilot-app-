<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="#0f172a" />
      <stop offset="100%" stopColor="#1e1b4b" />
    </linearGradient>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="#38bdf8" />
      <stop offset="100%" stopColor="#6366f1" />
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="#f59e0b" />
      <stop offset="100%" stopColor="#ef4444" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#0284c7" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Background rounded squircle with safe margin -->
  <rect width="512" height="512" rx="128" fill="url(#bg)" />
  <rect x="24" y="24" width="464" height="464" rx="108" fill="none" stroke="rgba(56, 189, 248, 0.2)" stroke-width="4" />

  <!-- Center Graphic: Modern Graduation Cap & Ascent Rocket -->
  <g transform="translate(256, 256)" filter="url(#shadow)">
    <!-- Graduation Cap Top Diamond -->
    <path d="M 0 -110 L 140 -50 L 0 10 L -140 -50 Z" fill="url(#grad1)" />
    
    <!-- Cap Under-band / Skull cap -->
    <path d="M -80 -25 C -80 40 80 40 80 -25 Z" fill="#2563eb" opacity="0.9" />

    <!-- Tassel ribbon -->
    <path d="M 120 -50 Q 145 -10 135 45" fill="none" stroke="#f59e0b" stroke-width="8" stroke-linecap="round" />
    <circle cx="135" cy="55" r="10" fill="#f59e0b" />

    <!-- Rocket / Ascent Arrow symbolizing Career Pilot -->
    <g transform="translate(0, 45)">
      <!-- Rocket Body -->
      <path d="M 0 -80 C 25 -40 25 15 20 40 L -20 40 C -25 15 -25 -40 0 -80 Z" fill="#ffffff" />
      <circle cx="0" cy="-20" r="12" fill="#0284c7" />
      <!-- Left Fin -->
      <path d="M -20 15 L -45 45 L -20 40 Z" fill="url(#grad1)" />
      <!-- Right Fin -->
      <path d="M 20 15 L 45 45 L 20 40 Z" fill="url(#grad1)" />
      <!-- Flame -->
      <path d="M -12 42 C 0 85 0 85 12 42 Z" fill="url(#accent)" />
    </g>
  </g>
</svg>
