    <script>
      // Gracefully silence benign WebSocket/HMR disconnect messages in iframe environment
      window.addEventListener('error', function(e) {
        if (e.message && (e.message.includes('WebSocket') || e.message.includes('ws') || (e.filename && e.filename.includes('@vite/client')))) {
          e.stopImmediatePropagation();
          e.preventDefault();
          return true;
        }
      }, true);
      window.addEventListener('unhandledrejection', function(e) {
        if (e.reason && (String(e.reason).includes('WebSocket') || (e.reason.message && e.reason.message.includes('WebSocket')))) {
          e.stopImmediatePropagation();
          e.preventDefault();
        }
      }, true);
    </script>
